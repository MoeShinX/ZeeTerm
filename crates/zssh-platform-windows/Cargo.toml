[package]
name = "zssh-platform-windows"
description = "Z-SSH 的 Windows 平台能力：不依赖 Tauri / GPUI"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
tracing.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS 的原生能力：NSUserDefaults（明暗主题）、NSLocale（系统语言）、
# NSPasteboard（剪贴板，含“这次写入”的私有标记）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSLocale",
    "NSString",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFData",
    "CFDictionary",
    "CFString",
] }
# 只存资料库密钥，不逐条存秘密。
objc2-security = { version = "0.3", features = ["SecItem", "SecBase"] }

# 单实例的文件锁（flock）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
