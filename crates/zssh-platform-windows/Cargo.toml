[package]
name = "zssh-platform-windows"
description = "Z-SSH 的 Windows 平台能力：不依赖 Tauri / GPUI"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
tracing.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# 单实例的激活套接字要核对对端 uid（SO_PEERCRED），标准库还没有稳定的接口。
libc = "0.2"

# macOS 的系统界面语言（NSLocale.preferredLanguages）：Finder 启动的程序没有 LANG 可看。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSLocale", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    # CreateMutexW（单实例）在 windows crate 里挂在 Win32_Security 下；不写的话单独编这个 crate 会失败，
    # 只是在整个工作区一起编时被别的 crate 打开的同名特性掩盖了。
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
