[package]
name = "zssh-protocols"
description = "ZeeTerm Telnet 与串口会话后端：协议状态机、协商、自动登录、串口读写，接到 zssh-session 的会话抽象"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zssh-core = { path = "../../crates/zssh-core" }
zssh-session = { path = "../zssh-session" }
zssh-terminal = { path = "../zssh-terminal" }
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"] }
# Telnet / 串口的非 UTF-8 编码（GBK、Big5、Shift-JIS、EUC-KR、Latin1）与终端的 UTF-8 之间互转。
encoding_rs = "0.8"
# 自动登录用的密码在内存里用完清零。
zeroize = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# 串口直接用 Win32（CreateFileW + 重叠 I/O + SetCommState）：见 src/serial/os.rs 顶部的取舍说明。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }

[lints]
workspace = true
