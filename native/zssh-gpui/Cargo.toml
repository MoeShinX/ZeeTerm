[package]
name = "zssh-gpui"
description = "ZeeTerm (the native GPUI app of Z-SSH) entry (prototype, no production data)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
gpui-kit = { version = "=0.8.1", features = ["syntect"] }
gpui = { package = "gpui-pre", version = "=0.3.10" }
image = { version = "0.25", default-features = false, features = ["png"] }
# 更新说明显示前先用它解析、改写（去 HTML / 图片 / 非 https 链接），版本与 gpui-base 用的是同一个。
markdown = "1.0.0"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "default-tls",
    "json",
    "stream",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tray-icon = "=0.25.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "fs", "macros"] }
zssh-app-runtime = { path = "../../crates/zssh-app-runtime" }
zssh-core = { path = "../../crates/zssh-core" }
zssh-editor = { path = "../zssh-editor" }
zssh-platform-windows = { path = "../../crates/zssh-platform-windows" }
zssh-protocols = { path = "../zssh-protocols" }
zssh-regex = { path = "../zssh-regex" }
zssh-session = { path = "../zssh-session" }
zssh-terminal = { path = "../zssh-terminal" }
zssh-update = { path = "../zssh-update" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
base64 = "0.22"
minisign = "0.10"
rand = "0.10"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
# 进程内 SFTP 服务器夹具（src/test_sftp_server.rs、test_ssh_server.rs 的 SFTP 部分，测试和 examples/fake_sftp_server.rs 共用）。
russh-sftp = "3.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
