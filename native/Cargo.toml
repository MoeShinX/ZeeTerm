[workspace]
members = ["zssh-gpui", "tools/icons", "zssh-protocols", "zssh-regex", "zssh-session", "zssh-terminal", "zssh-update", "zssh-editor"]
resolver = "2"

[workspace.package]
# 与根 workspace 的版本保持一致（有测试比对）：
# 更新器用它判断「公告版本是否更新」，写成 0.0.0 会让任何旧包都显得可更新。
version = "0.3.4"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# 库代码不 unwrap / expect（AGENTS.md）。门禁是 clippy -D warnings，所以 warn 也会挡住提交；
# 测试代码放行见 clippy.toml。
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Argon2id 的参数很重（同步包解一次要上百 MiB 内存）。debug 构建里它比 release 慢十几倍，
# 同步 / 备份的测试每次都要派生密钥；只把这两个依赖提到 opt-level 3（和根 workspace 一样），
# 自己的代码照旧是 debug。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# 发布版优化，和根工作区的 [profile.release] 保持一致：native 是独立工作区，根的 profile 对它
# 不生效，以前这里没写，出货的 exe 就是没有 LTO、没去符号的默认发布配置。
# 改这里时记得同步根 Cargo.toml（两处要一样）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# 门禁（scripts/gates.ps1）用的轻量配置：和 release 只差 LTO / 并行代码生成单元，
# opt-level、debug-assertions、overflow-checks、panic 都继承 release，所以 `cfg(debug_assertions)` 为 false，
# 测试钩子在这里读不到环境变量，和出货版一致；省下的是 thin LTO + 单个代码生成单元的链接耗时。
# 正式发版（native/installer/build.ps1、release.yml、scripts/release.ps1）仍然用完整的 release。
# 改这里时记得同步另一个工作区的 Cargo.toml（两处要一样）。
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
