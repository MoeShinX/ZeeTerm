[workspace]
members = ["zssh-gpui", "zssh-protocols", "zssh-regex", "zssh-session", "zssh-terminal", "zssh-update", "zssh-editor"]
resolver = "2"

[workspace.package]
# 与根 workspace 的版本保持一致（有测试比对）：
# 更新器用它判断「公告版本是否更新」，写成 0.0.0 会让任何旧包都显得可更新。
version = "0.3.3"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# 库代码不 unwrap / expect（AGENTS.md）。门禁是 clippy -D warnings，所以 warn 也会挡住提交；
# 测试代码放行见 clippy.toml。
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Argon2id 的参数很重（同步包解一次要上百 MiB 内存）。debug 构建里它比 release 慢十几倍，
# 同步 / 备份的测试每次都要派生密钥；只把这两个依赖提到 opt-level 3（和根 workspace 一样），
# 自己的代码照旧是 debug。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
