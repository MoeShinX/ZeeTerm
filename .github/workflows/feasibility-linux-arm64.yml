# Linux ARM64 打包可行性：单独的工作流，不进入 main 的 ci.yml 聚合运行。
#
# 为什么不放进 ci.yml：发版工作流要求同一提交在 main 上的那次 ci.yml 整次成功；把 ARM64
# 实验任务塞进去，arm64 runner 排队/编译/打包/容器检查一失败就会挡住 Windows、Linux x86_64
# 和 macOS arm64 的正式发布。这里只做可行性，失败只影响这个工作流自己。
#
# 触发：相关文件的 pull_request，或手动 workflow_dispatch（工作流文件进了默认分支后才能手动触发）。
name: "Feasibility: Linux ARM64"

on:
  pull_request:
    paths:
      - "native/**"
      - "crates/**"
      - "scripts/package-linux.sh"
      - "scripts/linux-container-check.sh"
      - "scripts/linux-build-deps.sh"
      - "native/installer/linux/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/feasibility-linux-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feasibility-linux-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux-arm64:
    name: Linux ARM64（可行性）
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: 取代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 装系统依赖（scripts/linux-build-deps.sh）
        run: ./scripts/linux-build-deps.sh

      - name: 装 Rust（按 rust-toolchain.toml）
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      # zeeterm-mcp 在根工作区，打包时现编，所以两个 target 都缓存。
      - name: 缓存 cargo 的编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            native -> target
          key: feasibility-linux-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 跑完整的原生工作区测试，和 ci.yml 的 Linux 原生测试保持一致：过滤 "update" 会连带
      # 选中名字里含 update 的其它测试（例如 host_form 的凭据测试），也不能覆盖其它架构假设。
      # 钥匙串用一次性的 D-Bus 会话；ZEETERM_VAULT_MEMORY 给需要内存保险库的测试兜底。
      - name: "原生 cargo test（完整）"
        env:
          ZEETERM_VAULT_MEMORY: "1"
          ZEETERM_DATA_DIR: ${{ runner.temp }}/zeeterm-data
        run: |
          mkdir -p "$ZEETERM_DATA_DIR"
          ./scripts/linux-keyring-session.sh cargo test --manifest-path native/Cargo.toml --workspace --locked

      # 打包：只构建、只作为这次运行的 artifact 保存给人下载试装。REQUIRE_CHECKS 让 lintian / appstreamcli 缺失
      # 或 glibc 超过 2.35 基线都按失败处理。
      - name: "打 arm64 deb + tar.gz（只构建，不发布，不签名）"
        env:
          ZEETERM_PKG_REQUIRE_CHECKS: "1"
        run: ./scripts/package-linux.sh --arch aarch64 --out-dir dist/linux-arm64

      # 依赖基线：干净的 arm64 Debian 12 / Ubuntu 22.04 容器里装 deb，ldd 无 not found，zeeterm --version 能跑，卸载干净。
      - name: 容器里装一遍（debian:12、ubuntu:22.04 arm64）
        run: ./scripts/linux-container-check.sh dist/linux-arm64/ZeeTerm-*-linux-aarch64.deb

      - name: 上传 arm64 安装包（构建产物，不是正式包）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeeterm-linux-arm64
          path: |
            dist/linux-arm64/ZeeTerm-*-linux-aarch64.deb
            dist/linux-arm64/ZeeTerm-*-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
