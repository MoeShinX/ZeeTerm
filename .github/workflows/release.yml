# ZeeTerm 发版：推 v* tag 后在 GitHub 上编译、签名、发布 Release。
#
# 流程（11-07 起）：
#   verify   （ubuntu）校验 tag / 版本号 / 提交在 main 上 / 更新说明 / 公钥 / Release 还不存在，
#            并要求这个提交在 main 上的 CI（ci.yml，Windows + Linux + macOS 全套 fmt / clippy / test / 打包）已经通过。
#            门禁不在这里重跑：发版前 main 上的 CI 已经对同一个提交跑过一遍。
#   linux    （ubuntu-22.04）完整 release 编译出 deb + tar.gz，容器里装一遍，上传为 artifact。
#   windows  （windows-latest）完整 release 编译出安装包，上传为 artifact。和 linux 并行。
#   release  （windows-latest，release 环境）取回三个包 -> 用更新私钥签名并自检 -> latest.json /
#            SHA256SUMS.txt / Release 正文 -> gh release create。只有这个任务拿得到私钥。
# 改版本号、写更新说明、打 tag 的步骤见 docs/RELEASING.md（先 scripts/bump-version.ps1，提交推 main，等 CI 通过，再推 tag）。
#
# 密钥：更新签名私钥和口令放在仓库的 `release` 环境（Settings -> Environments -> release）里，
#   ZEETERM_UPDATER_KEY            私钥文件全文
#   ZEETERM_UPDATER_KEY_PASSWORD   私钥口令
# 只有本工作流的 release 这个 job 拿得到；而且只暴露给"写私钥文件"和"签名"两个步骤，编译、跑测试的步骤环境里没有它们。
# 日志里不打印私钥和口令（GitHub 会对 Secret 打码，这里也不 echo，签名工具不开详细输出）。
#
# 第三方 action 一律钉 commit SHA；能用 gh 做的事不引入新的 action。
name: Release

on:
  push:
    tags: ["v*"]
  # 重跑 / 补发：从 main 分支触发，输入已经存在的 tag（例如 v0.4.0）。该 tag 的 Release 必须还不存在。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.4.0；必须已经存在，且在 main 上）"
        required: true
        type: string

# 默认什么权限都不给；各 job 按需声明（只有 release 要 contents: write）。
permissions: {}

# 同一个 tag 只跑一个；后来的排队等着，不取消正在进行的发版。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # 早失败的校验，加上"main 上的 CI 已通过"这道闸。它失败，后面任何编译都不会开始。
  verify:
    name: 校验（tag、版本、CI）
    # 手动触发只接受从 main 触发：别的分支上的工作流文件可能被改过。
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: 取代码（要完整历史，用来核对 tag 在 main 上）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验 tag、版本号、更新说明、公钥，以及 main 上的 CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          re='^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?)$'
          if [[ ! $TAG =~ $re ]]; then
            echo "tag 要写成 vX.Y.Z（可带 -rc.1 这类后缀）：$TAG" >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          for manifest in native/Cargo.toml Cargo.toml; do
            declared=$(awk '
              /^\[workspace\.package\]/ { in_section = 1; next }
              /^\[/ { in_section = 0 }
              in_section && /^[[:space:]]*version[[:space:]]*=/ { gsub(/^[^"]*"|"[^"]*$/, ""); print; exit }
            ' "$manifest")
            if [ "$declared" != "$version" ]; then
              echo "tag 是 $TAG，但 $manifest 的版本是 $declared。先用 scripts/bump-version.ps1 改版本号并提交。" >&2
              exit 1
            fi
          done
          head=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$head" != "$tag_commit" ]; then
            echo "检出的提交 $head 不是 tag $TAG 指向的提交 $tag_commit。" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "tag $TAG 指向的提交不在 main 上：先把它合进 main，再在 main 的提交上打 tag。" >&2
            exit 1
          fi
          notes="docs/release-notes/$version.md"
          if [ ! -s "$notes" ] || [ -z "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "缺少或是空的：$notes。" >&2
            exit 1
          fi
          pubkey=$(sed -n 's/.*"pubkey"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' native/zssh-update/updater.json | head -1)
          if [ -z "$pubkey" ] || [[ ${pubkey^^} == PLACEHOLDER* ]]; then
            echo "native/zssh-update/updater.json 的 pubkey 还是占位值。" >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "tag $TAG 的 Release 已经存在，不会覆盖。要重发请先删掉那个 Release（以及里面的附件）。" >&2
            exit 1
          fi
          # main 上这个提交的 CI（push 到 main 触发的那次，或在 main 上手动触发的）必须有一次成功。
          # 门禁不在发版里重跑，所以这道闸不能放松：没跑完、失败、被取消都不发。
          conclusions=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$head&branch=main&per_page=20" \
            --jq '[.workflow_runs[] | "\(.status)/\(.conclusion // "none")"] | join(" ")')
          echo "main 上提交 $head 的 CI：${conclusions:-（没有）}"
          if [[ " $conclusions " != *" completed/success "* ]]; then
            echo "这个提交在 main 上还没有一次通过的 CI（ci.yml）。等 CI 跑完并通过后再重跑发版（Actions 页 Re-run，或 Run workflow 输入 $TAG）。" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $TAG，版本 $version，提交 $head：校验通过，main 上的 CI 已通过。"

  # Linux 包在 ubuntu-22.04 上编（glibc 2.35 基线）。这个任务只读代码、不使用环境和密钥；它产出的两个文件由下面的
  # release 任务取回后签名。任何一步失败，release 任务不会开始，也就不会发布任何东西。和 windows 任务并行。
  linux:
    name: 编译 Linux 包（ubuntu-22.04）
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: 取代码（要完整历史，用来核对 tag 在 main 上）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false

      - name: 版本号
        run: echo "VERSION=${{ needs.verify.outputs.version }}" >> "$GITHUB_ENV"

      - name: 装系统依赖（scripts/linux-build-deps.sh）
        run: ./scripts/linux-build-deps.sh

      - name: 装 Rust（按 rust-toolchain.toml）
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - name: 缓存 cargo 的编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            native -> target
          key: release-linux

      - name: 打 deb + tar.gz（完整 release 编译）
        env:
          ZEETERM_PKG_REQUIRE_CHECKS: "1"
        run: |
          ./scripts/package-linux.sh --out-dir "dist/linux/$VERSION"
          test -f "dist/linux/$VERSION/ZeeTerm-$VERSION-linux-x86_64.deb"
          test -f "dist/linux/$VERSION/ZeeTerm-$VERSION-linux-x86_64.tar.gz"

      - name: 容器里装一遍（debian:12、ubuntu:22.04）
        run: ./scripts/linux-container-check.sh "dist/linux/$VERSION/ZeeTerm-$VERSION-linux-x86_64.deb"

      - name: 上传 Linux 包（给 release 任务签名用）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeeterm-linux-release
          path: |
            dist/linux/${{ env.VERSION }}/ZeeTerm-${{ env.VERSION }}-linux-x86_64.deb
            dist/linux/${{ env.VERSION }}/ZeeTerm-${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Windows 安装包：完整 release 编译。只读代码、不在 release 环境里、拿不到私钥；和 linux 并行。
  windows:
    name: 编译 Windows 安装包（windows-latest）
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: 取代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false

      - name: 版本号
        shell: pwsh
        run: '"VERSION=${{ needs.verify.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      # 版本由 rust-toolchain.toml 固定；无参数的 rustup toolchain install 就是按那个文件安装。
      - name: 装 Rust（按 rust-toolchain.toml，MSVC）
        shell: pwsh
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - name: 缓存 cargo 的编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            native -> target
          key: release

      - name: 装 NSIS（runner 镜像里没有时才装）
        shell: pwsh
        run: |
          $known = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not ($known | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 打安装包
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\$env:VERSION"
          ./native/installer/build.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $out "ZeeTerm-Setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "没有找到预期的安装包：$installer" }

      - name: 上传安装包（给 release 任务签名用）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeeterm-windows-release
          path: dist/${{ env.VERSION }}/ZeeTerm-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: 签名、发布（windows-latest）
    needs: [verify, linux, windows]
    # 手动触发只接受从 main 触发：别的分支上的工作流文件可能被改过，不能让它碰到私钥。
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write

    steps:
      - name: 取代码（要完整历史，用来核对 tag 在 main 上）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验 tag、版本号和更新说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.]*)?)$') {
            throw "tag 要写成 vX.Y.Z（可带 -rc.1 这类后缀）：$env:TAG"
          }
          $version = $Matches[1]
          . ./scripts/release-lib.ps1

          # 1. tag 去掉 v 之后必须等于两个工作区的版本号（程序里显示的版本、安装包文件名都来自它）。
          foreach ($manifest in @('native/Cargo.toml', 'Cargo.toml')) {
            $declared = Get-WorkspaceVersion (Join-Path $env:GITHUB_WORKSPACE $manifest)
            if ($declared -ne $version) { throw "tag 是 $env:TAG，但 $manifest 的版本是 $declared。先用 scripts/bump-version.ps1 改版本号并提交。" }
          }

          # 2. 检出的就是 tag 指向的提交，而且这个提交在 main 上（没合进 main 的提交不发版）。
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "refs/tags/$($env:TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $tagCommit) { throw "检出的提交 $head 不是 tag $env:TAG 指向的提交 $tagCommit。" }
          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:TAG 指向的提交不在 main 上：先把它合进 main，再在 main 的提交上打 tag。" }

          # 3. 面向用户的更新说明必须存在且不是空的。
          $notes = "docs/release-notes/$version.md"
          $notesPath = Join-Path $env:GITHUB_WORKSPACE $notes
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "缺少 $notes。" }
          if ((Read-Text $notesPath).Text.Trim() -eq '') { throw "$notes 是空的。" }

          # 4. 公钥不能还是占位值（真正核对公钥和私钥是一对，在拿到私钥的签名那一步）。
          $pubkey = Get-ConfiguredPubkey (Join-Path $env:GITHUB_WORKSPACE 'native/zssh-update/updater.json')
          if ($pubkey -eq '' -or $pubkey.ToUpperInvariant().StartsWith('PLACEHOLDER')) { throw 'native/zssh-update/updater.json 的 pubkey 还是占位值。' }

          # 5. 这个 tag 的 Release 还不存在（早点失败，别等编译完才发现）。
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "tag $env:TAG 的 Release 已经存在，不会覆盖。要重发请先删掉那个 Release（以及里面的附件）。" }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "tag $env:TAG，版本 $version，提交 $head：校验通过。"
          # 上面 `gh release view` 查不到 Release 时退出码是 1（正是我们要的结果），pwsh 步骤会把
          # 最后一个原生命令的退出码当成整步的结果，所以这里明确以成功结束。
          exit 0

      # 版本由 rust-toolchain.toml 固定；无参数的 rustup toolchain install 就是按那个文件安装。
      - name: 装 Rust（按 rust-toolchain.toml，MSVC）
        shell: pwsh
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - name: 缓存 cargo 的编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            native -> target
          key: release-sign

      # Windows 任务打好的安装包：同样在私钥写出来之前取回并核对。
      - name: 取回 Windows 安装包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zeeterm-windows-release
          path: windows-dist

      - name: 核对 Windows 安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ZeeTerm-Setup-$env:VERSION.exe"
          $actual = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows-dist') -Recurse -File)
          if ($actual.Count -ne 1 -or $actual[0].Name -ne $name) {
            throw "Windows 安装包的文件清单不对：期望 [$name]，实际 [$(($actual | ForEach-Object { $_.Name }) -join ', ')]。"
          }
          if ($actual[0].Length -le 0) { throw "$name 是空文件。" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\$env:VERSION"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath $actual[0].FullName -Destination (Join-Path $dist $name) -Force
          Write-Host "已取回 Windows 安装包：$name"

      # Linux 任务打好的 deb 和 tar.gz：在私钥写出来之前取回并核对文件名，签名那一步一并签。
      - name: 取回 Linux 包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zeeterm-linux-release
          path: linux-dist

      - name: 核对 Linux 包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $linux = Join-Path $env:GITHUB_WORKSPACE 'linux-dist'
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\$env:VERSION"
          $expected = @("ZeeTerm-$env:VERSION-linux-x86_64.deb", "ZeeTerm-$env:VERSION-linux-x86_64.tar.gz")
          $actual = @(Get-ChildItem -LiteralPath $linux -Recurse -File | ForEach-Object { $_.Name }) | Sort-Object
          if (($actual -join '|') -ne (($expected | Sort-Object) -join '|')) {
            throw "Linux 包的文件清单不对：期望 [$($expected -join ', ')]，实际 [$($actual -join ', ')]。"
          }
          foreach ($name in $expected) {
            $file = Get-ChildItem -LiteralPath $linux -Recurse -File -Filter $name | Select-Object -First 1
            if ($file.Length -le 0) { throw "$name 是空文件。" }
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $dist $name) -Force
          }
          Write-Host "已取回 Linux 包：$($expected -join '、')"

      # 私钥只在"写文件"到"清理"之间存在于磁盘，文件放在 runner 的临时目录；下面的清理步骤 always() 一定会删。
      - name: 写出更新私钥（临时文件）
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.ZEETERM_UPDATER_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) { throw 'Secret ZEETERM_UPDATER_KEY 是空的（release 环境里没设，或工作流没拿到环境）。' }
          # 统一成 LF 并保证末尾有换行：Secret 是从文件灌进去的，换行风格取决于当时怎么灌的。
          $text = ($env:UPDATER_KEY -replace "`r`n", "`n").TrimEnd() + "`n"
          $path = Join-Path $env:RUNNER_TEMP 'zeeterm-updater.key'
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: 签名并生成 latest.json、SHA256SUMS.txt、Release 正文（含 Linux 包）
        shell: pwsh
        env:
          ZEETERM_UPDATER_KEY_PASSWORD: ${{ secrets.ZEETERM_UPDATER_KEY_PASSWORD }}
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\$env:VERSION"
          ./scripts/release-sign.ps1 `
            -Version $env:VERSION `
            -InstallerPath (Join-Path $dist "ZeeTerm-Setup-$env:VERSION.exe") `
            -KeyPath (Join-Path $env:RUNNER_TEMP 'zeeterm-updater.key') `
            -LinuxDebPath (Join-Path $dist "ZeeTerm-$env:VERSION-linux-x86_64.deb") `
            -LinuxTarPath (Join-Path $dist "ZeeTerm-$env:VERSION-linux-x86_64.tar.gz") `
            -OutDir $dist `
            -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 删掉临时私钥文件
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'zeeterm-updater.key'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          if (Test-Path -LiteralPath $path) { throw '临时私钥文件没删掉。' }
          Write-Host '临时私钥文件已删除。'

      # gh release create 遇到同名 Release 会报错而不是覆盖；--verify-tag 要求 tag 已在远端。
      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\$env:VERSION"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "tag $env:TAG 的 Release 已经存在，不会覆盖。" }
          gh release create $env:TAG `
            (Join-Path $dist "ZeeTerm-Setup-$env:VERSION.exe") `
            (Join-Path $dist "ZeeTerm-$env:VERSION-linux-x86_64.deb") `
            (Join-Path $dist "ZeeTerm-$env:VERSION-linux-x86_64.tar.gz") `
            (Join-Path $dist 'latest.json') `
            (Join-Path $dist 'SHA256SUMS.txt') `
            --verify-tag `
            --title "ZeeTerm $env:VERSION" `
            --notes-file (Join-Path $dist 'RELEASE_NOTES.md')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "已发布：$env:TAG"
